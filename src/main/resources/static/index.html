<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>商城助手</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f7; color: #1f2329; }
  .app { max-width: 820px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; }
  header { padding: 12px 16px; background: #fff; border-bottom: 1px solid #e5e6eb; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0 8px 0 0; }
  header label { font-size: 13px; color: #646a73; display: flex; align-items: center; gap: 6px; }
  header input { padding: 5px 8px; border: 1px solid #d0d3d9; border-radius: 6px; font-size: 13px; }
  header button { padding: 5px 10px; border: 1px solid #d0d3d9; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; font-size: 14px; }
  .user { align-self: flex-end; background: #3370ff; color: #fff; border-bottom-right-radius: 4px; }
  .bot { align-self: flex-start; background: #fff; border: 1px solid #e5e6eb; border-bottom-left-radius: 4px; }
  .meta { font-size: 11px; color: #8f959e; margin-top: 6px; }
  .hint { align-self: center; font-size: 12px; color: #8f959e; }
  form { display: flex; gap: 8px; padding: 12px 16px; background: #fff; border-top: 1px solid #e5e6eb; }
  form input { flex: 1; padding: 10px 12px; border: 1px solid #d0d3d9; border-radius: 8px; font-size: 14px; }
  form button { padding: 10px 20px; border: 0; background: #3370ff; color: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
  form button:disabled { background: #a5b8f2; cursor: not-allowed; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>商城助手</h1>
    <label>用户 <input id="userId" value="u1001" size="8"></label>
    <label>会话 <input id="sessionId" size="14"></label>
    <button id="newSession" type="button">新会话</button>
  </header>
  <div id="chat">
    <div class="hint">试试:推荐一款3000元左右的华为手机 · 查一下我最近的订单 · 签收后能退货吗</div>
  </div>
  <form id="form">
    <input id="input" placeholder="输入问题,回车发送" autocomplete="off" maxlength="2000">
    <button id="send" type="submit">发送</button>
  </form>
</div>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const userId = document.getElementById('userId');
const sessionId = document.getElementById('sessionId');

function newSession() { sessionId.value = 's' + Math.random().toString(36).slice(2, 10); }
document.getElementById('newSession').onclick = newSession;
newSession();

function addMessage(cls, text) {
  const el = document.createElement('div');
  el.className = 'msg ' + cls;
  const body = document.createElement('div');
  body.textContent = text;                 // textContent 而不是 innerHTML,避免注入
  el.appendChild(body);
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return { el, body };
}

// 用 fetch 读 SSE:EventSource 不支持 POST 和自定义请求头
async function ask(message) {
  const bot = addMessage('bot', '');
  const meta = document.createElement('div');
  meta.className = 'meta';
  bot.el.appendChild(meta);

  const resp = await fetch('/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Accept': 'text/event-stream', 'X-User-Id': userId.value.trim() },
    body: JSON.stringify({ sessionId: sessionId.value.trim(), message })
  });
  if (!resp.ok) {
    let msg = '请求失败(' + resp.status + ')';
    try { msg = (await resp.json()).message || msg; } catch (e) {}
    bot.body.textContent = msg;
    return;
  }

  const reader = resp.body.getReader();
  const decoder = new TextDecoder('utf-8');
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const block = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      handleEvent(block, bot, meta);
    }
  }
}

function handleEvent(block, bot, meta) {
  let event = 'message';
  const data = [];
  for (const line of block.split('\n')) {
    if (line.startsWith('event:')) event = line.slice(6).trim();
    else if (line.startsWith('data:')) data.push(line.slice(5).replace(/^ /, ''));
  }
  const text = data.join('\n');
  if (event === 'trace') meta.textContent = 'traceId: ' + text;
  else if (event === 'message') { bot.body.textContent += text; chat.scrollTop = chat.scrollHeight; }
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  input.value = '';
  addMessage('user', message);
  send.disabled = true;
  try { await ask(message); }
  catch (err) { addMessage('bot', '网络错误:' + err.message); }
  finally { send.disabled = false; input.focus(); }
});
</script>
</body>
</html>
