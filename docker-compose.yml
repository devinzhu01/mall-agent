# 本地依赖。MySQL 若你已有本机实例,可以只启动 redis 和 qdrant
services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: mall_agent
    ports: ["3306:3306"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant
    ports: ["6333:6333", "6334:6334"]   # 6334 为 gRPC,应用使用该端口
